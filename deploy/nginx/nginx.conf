events {}

http {
    # DNS interno do Docker: re-resolve "api" a cada 10s, então réplicas novas
    # (docker compose --scale) entram no balanceamento sem reiniciar o Nginx.
    resolver 127.0.0.11 valid=10s;

    log_format json escape=json '{"time":"$time_iso8601","status":$status,"uri":"$request_uri",'
                                '"upstream":"$upstream_addr","request_time":$request_time}';
    access_log /dev/stdout json;

    server {
        listen 80;
        set $api_upstream http://api:8080;

        location / {
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;   # explicações via LLM podem levar dezenas de segundos
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
