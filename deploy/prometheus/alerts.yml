groups:
  - name: diagnostico-api
    rules:
      - alert: LatenciaAltaPredicao
        expr: histogram_quantile(0.95, sum by (le) (rate(api_request_latency_seconds_bucket{endpoint="/predict"}[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 de /predict acima de 500 ms — considerar mais réplicas"

      - alert: TaxaDeErroAlta
        expr: sum(rate(api_requests_total{status=~"5.."}[5m])) / sum(rate(api_requests_total[5m])) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Mais de 5% das requisições com erro 5xx"

      - alert: LLMIndisponivel
        expr: increase(llm_errors_total[10m]) > 5
        labels: {severity: warning}
        annotations:
          summary: "Falhas repetidas ao chamar a LLM"

      - alert: PossivelDriftDeDados
        # Proporção de malignos na última hora muito diferente da base de treino (~37%).
        expr: |
          abs(
            sum(increase(model_predictions_total{label="maligno"}[1h]))
            / sum(increase(model_predictions_total[1h])) - 0.37
          ) > 0.20
        for: 30m
        labels: {severity: info}
        annotations:
          summary: "Distribuição das predições mudou — avaliar drift e re-otimizar o modelo"

      - alert: MuitosCasosLimitrofes
        expr: sum(rate(model_low_confidence_total[1h])) / sum(rate(model_predictions_total[1h])) > 0.15
        for: 30m
        labels: {severity: info}
        annotations:
          summary: "Mais de 15% das predições com confiança baixa"
