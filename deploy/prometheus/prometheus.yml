global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Descobre TODAS as réplicas do serviço "api" pela API do Docker (cada container vira um
  # alvo). A descoberta por DNS (dns_sd_configs) devolvia só um IP do serviço com réplicas.
  - job_name: api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.service=api"]
    relabel_configs:
      - source_labels: [__meta_docker_container_network_ip]
        regex: (.+)
        target_label: __address__
        replacement: $1:8080
      - source_labels: [__meta_docker_container_name]
        regex: /?(.*)
        target_label: instance
    metrics_path: /metrics
